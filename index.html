<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>גיאו-להב</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#23305a;--blue:#4a9bff;--gold:#ffd23f;--pink:#ff7eb6;--green:#5fd68a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{margin:0;font-family:"Noto Sans Hebrew","Segoe UI",Arial,sans-serif;line-height:1.5;letter-spacing:.01em;color:var(--ink);min-height:100vh;
  background:linear-gradient(#bfe9ff,#eafcff 55%,#c9f2c7);overflow-x:hidden}
header{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px}
h1{margin:0;font-size:clamp(22px,4vw,34px)}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-size:20px;font-weight:700;box-shadow:0 3px 0 #0001;border:0;color:var(--ink);cursor:pointer}
main{max-width:900px;margin:0 auto;padding:0 16px 190px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{background:#fff;border-radius:22px;padding:18px 10px;text-align:center;font-size:20px;font-weight:700;
  box-shadow:0 5px 0 #0002;cursor:pointer;border:0;color:var(--ink)}
.tile .em{font-size:48px;display:block;margin-bottom:6px}
.tile.locked{opacity:.55}
.tile:active{transform:translateY(3px)}
.q{font-size:clamp(22px,4.5vw,34px);font-weight:800;text-align:center;margin:10px 0 14px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.dot.done{background:var(--green)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.card{background:#fff;border-radius:22px;aspect-ratio:1;border:0;box-shadow:0 5px 0 #0002;cursor:pointer;padding:12px}
.card svg{width:100%;height:100%}
.card.ok{animation:pop .5s;background:#d8ffe6}
.card.no{animation:shake .4s;background:#ffe1e1}
.fb{min-height:36px;text-align:center;font-size:22px;font-weight:700;margin:12px 0}
.big{background:var(--pink);color:#fff;border:0;border-radius:18px;padding:14px 28px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0003}
.center{text-align:center}
#pal{position:fixed;left:10px;bottom:6px;display:flex;align-items:flex-end;gap:8px;pointer-events:none;z-index:5}
#pal>*{pointer-events:auto}
#ch{width:clamp(110px,22vw,170px);cursor:pointer}
#ch.bounce{animation:bounce .6s}
#bubble{background:#fff;border-radius:18px;padding:10px 14px;font-size:20px;font-weight:700;max-width:200px;
  box-shadow:0 4px 0 #0002;margin-bottom:60px;opacity:0;transition:opacity .25s}
#bubble.on{opacity:1}
.sw{position:fixed;right:10px;bottom:10px;z-index:5}
.puff{position:fixed;font-size:44px;pointer-events:none;animation:puff 1.4s forwards;z-index:9}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bounce{30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
@keyframes puff{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(-60px,-50px) scale(1.8)}}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:#fff;border-radius:24px;max-width:560px;max-height:90vh;overflow:auto;padding:18px 22px;box-shadow:0 8px 0 #0003}
.mbox h2{margin:0 0 8px;font-size:26px}
.mbox ul{padding-inline-start:22px;font-size:20px;line-height:1.5;margin:8px 0}
.mbox .lvl{background:#eaf6ff;border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:700;font-size:18px}
button{font-family:inherit}
.slide{font-size:24px;line-height:1.7;margin:10px 0;text-align:center;min-height:96px}
.sdots{display:flex;justify-content:center;gap:8px;margin:8px 0 12px}
.sdots span{width:12px;height:12px;border-radius:50%;background:#cfd8ee}
.sdots span.on{background:var(--pink)}
.big[disabled]{opacity:.4;cursor:default}
.credit{margin-top:22px;font-size:16px;opacity:.85}
</style>
</head>
<body>
<header>
  <h1>🔷 גיאו-להב</h1>
  <button class="pill" id="home">🏠</button>
  <button class="pill" id="help" style="display:none">📖 הסבר</button>
  <button class="pill" id="nk" aria-label="ניקוד">ניקוד</button>
  <button class="pill" id="fsm" aria-label="להקטין את האותיות">א−</button>
  <button class="pill" id="fsp" aria-label="להגדיל את האותיות">א+</button>
  <div class="pill" id="stars">⭐ 0</div>
</header>
<main id="main"></main>

<div id="pal"><div id="ch"></div><div id="bubble"></div></div>
<button class="pill sw" id="sw">🔄 החליפי דמות</button>

<script>
// ---------- characters (SVG) ----------
const ELEPHANT=`<svg viewBox="0 0 200 200">
<ellipse cx="42" cy="100" rx="34" ry="42" fill="#6fb4ff"/><ellipse cx="42" cy="100" rx="20" ry="28" fill="#ffb6d5"/>
<ellipse cx="158" cy="100" rx="34" ry="42" fill="#6fb4ff"/><ellipse cx="158" cy="100" rx="20" ry="28" fill="#ffb6d5"/>

<path d="M92 40 L108 34 M90 48 L110 42" stroke="#e0a800" stroke-width="3"/>
<text x="124" y="30" font-size="20">✨</text>
<circle cx="78" cy="98" r="11" fill="#fff"/><circle cx="122" cy="98" r="11" fill="#fff"/>
<circle cx="80" cy="100" r="5" fill="#222"/><circle cx="120" cy="100" r="5" fill="#222"/>
<circle cx="66" cy="124" r="8" fill="#ff9ec6" opacity=".7"/><circle cx="134" cy="124" r="8" fill="#ff9ec6" opacity=".7"/>
</svg>`;
const MINION=`<svg viewBox="0 0 200 200">
<path d="M100 8 q-4 -2 -12 6 M100 8 q2 -6 8 -4 M100 8 q10 -4 14 4" stroke="#222" stroke-width="3" fill="none"/>

<circle cx="100" cy="64" r="18" fill="#fff"/><circle cx="100" cy="64" r="8" fill="#7a4a22"/><circle cx="100" cy="64" r="3.5" fill="#000"/>
<path d="M82 96 Q100 112 118 96" stroke="#7a3b00" stroke-width="4" fill="none" stroke-linecap="round"/>
<ellipse cx="50" cy="112" rx="10" ry="16" fill="#ffd93b" stroke="#c9a400" stroke-width="3"/>
<ellipse cx="150" cy="112" rx="10" ry="16" fill="#ffd93b" stroke="#c9a400" stroke-width="3"/>
<rect x="72" y="162" width="20" height="14" rx="6" fill="#222"/><rect x="108" y="162" width="20" height="14" rx="6" fill="#222"/>

// ---------- sounds (made with the browser, no files) ----------
let AC;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function beep(f,d,type,v,t0,f2){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(t0||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v||.2,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function sndElephant(){beep(260,.5,'sawtooth',.14,0,560);beep(560,.4,'sawtooth',.12,.45,380)}
function sndMinion(){for(let i=0;i<6;i++)beep(rnd(500,1300),.09,'square',.07,i*.1,rnd(500,1300))}
function sndYay(){[523,659,784,1047].forEach((f,i)=>beep(f,.18,'triangle',.18,i*.1))}
function sndOops(){beep(300,.25,'sine',.15,0,180)}

// ---------- character ----------
let who=load('who')||'elephant';
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const ch=document.getElementById('ch'),bubble=document.getElementById('bubble');
function drawChar(){ch.innerHTML=who==='elephant'?ELEPHANT:MINION}
let bt;
function say(txt){bubble.textContent=txt;bubble.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>bubble.classList.remove('on'),2800)}
function bounce(){ch.classList.remove('bounce');void ch.offsetWidth;ch.classList.add('bounce')}
function charSound(){who==='elephant'?sndElephant():sndMinion()}
ch.onclick=()=>{bounce();say(who==='elephant'?'טרווווווו! 🐘':'בננה! 🍌')};
document.getElementById('sw').onclick=()=>{
  who=who==='elephant'?'minion':'elephant';save('who',who);drawChar();bounce();
  say(who==='elephant'?'אני פיל חד קרן!':'בלה בלה בנאנה!');
};
document.addEventListener('pointerdown',()=>ac(),{once:true});

// ---------- stars ----------
let stars=parseInt(load('stars')||'0',10)||0;
const starsEl=document.getElementById('stars');
function showStars(){starsEl.textContent='⭐ '+stars}
function addStar(){stars++;save('stars',stars);showStars()}

// ---------- shapes ----------
const SHAPES=[
 {id:'circle',he:'עיגול',sides:0},{id:'triangle',he:'משולש',sides:3},{id:'square',he:'ריבוע',sides:4},
 {id:'rect',he:'מלבן',sides:4},{id:'pent',he:'מחומש',sides:5},{id:'hex',he:'משושה',sides:6},{id:'oct',he:'מתומן',sides:8}];
const COLORS=['#ff7eb6','#ffb347','#5fd68a','#6fb4ff','#b58cff','#ff6b6b','#2ec4b6'];
function poly(n,rot){
  let pts=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;pts.push((50+42*Math.cos(a)).toFixed(1)+','+(50+42*Math.sin(a)).toFixed(1))}
  return pts.join(' ');
}
function shapeSvg(s,col){
  const st=`fill="${col}" stroke="#23305a" stroke-width="3" stroke-linejoin="round"`;
  let b;
  switch(s.id){
    case'circle':b=`<circle cx="50" cy="50" r="40" ${st}/>`;break;
    case'square':b=`<rect x="14" y="14" width="72" height="72" ${st}/>`;break;
    case'rect':b=`<rect x="6" y="27" width="88" height="46" ${st}/>`;break;
    case'triangle':b=`<polygon points="${poly(3,-Math.PI/2)}" ${st}/>`;break;
    case'pent':b=`<polygon points="${poly(5,-Math.PI/2)}" ${st}/>`;break;
    case'hex':b=`<polygon points="${poly(6,0)}" ${st}/>`;break;
    case'oct':b=`<polygon points="${poly(8,Math.PI/8)}" ${st}/>`;break;
  }
  return `<svg viewBox="0 0 100 100">${b}</svg>`;
}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

// ---------- learning: explanations, levels, progress ----------
const APP_VERSION='1.0';
const GAMEFN={g1:()=>detective(),g2:()=>rulerGame(),g3:()=>buildGame(),g4:()=>mirrorGame(),g6:()=>angleGame(),g7:()=>perimGame(),g8:()=>chartGame(),g9:()=>spotAngleGame(),g10:()=>compareAngleGame(),g11:()=>polyAngleGame(),g12:()=>clockGame(),g13:()=>mysteryGame()};
const lvl=g=>Math.min(3,Math.max(1,parseInt(load('lvl_'+g)||'1',10)||1));
const SVG_ANGLES=`<svg viewBox="0 0 360 120" style="width:100%;max-width:420px;display:block;margin:6px auto"><g stroke="#23305a" stroke-width="4" stroke-linecap="round" fill="none"><path d="M20 90 L100 90 M20 90 L70 35"/><path d="M140 90 L220 90 M140 90 L140 25"/><path d="M270 90 L345 90 M270 90 L215 50"/></g><path d="M154 90 L154 76 L140 76" stroke="#e63946" stroke-width="3" fill="none"/><g font-size="18" font-weight="700" fill="#23305a" text-anchor="middle"><text x="60" y="112">חדה</text><text x="180" y="112">ישרה</text><text x="285" y="112">קהה</text></g></svg>`;
const SVG_PERIM=`<svg viewBox="0 0 360 120" style="width:100%;max-width:420px;display:block;margin:6px auto"><rect x="30" y="25" width="140" height="70" fill="rgba(111,180,255,.35)" stroke="#23305a" stroke-width="4"/><g font-size="20" font-weight="800" fill="#e63946" text-anchor="middle"><text x="100" y="18">4</text><text x="100" y="116">4</text><text x="188" y="66">2</text><text x="12" y="66">2</text></g><text x="280" y="66" font-size="20" font-weight="800" text-anchor="middle" fill="#23305a">4+2+4+2 = 12</text></svg>`;
const DEMO_HTML=`<div class="slide" style="min-height:0;font-size:20px">נסי בעצמך! גררי את הגוניה אל הפינה של הזווית, וסובבי אותה עם העיגול הוורוד.</div>
<svg id="dm" viewBox="0 0 600 330" style="width:100%;max-width:520px;display:block;margin:0 auto;background:#f6f9ff;border-radius:18px;touch-action:none"></svg>
<div class="center" style="margin-top:6px"><button class="big" data-d="50" style="background:var(--blue);padding:8px 16px;font-size:18px">חדה</button> <button class="big" data-d="90" style="background:var(--blue);padding:8px 16px;font-size:18px">ישרה</button> <button class="big" data-d="125" style="background:var(--blue);padding:8px 16px;font-size:18px">קהה</button></div>
<div class="fb" id="dmv" style="font-size:19px;min-height:52px"></div>`;
function initAngleDemo(){
  const svg=document.getElementById('dm'),vx=300,vy=165,R=135,rot=-25,verdict=document.getElementById('dmv');
  let deg=50,gx=80,gy=300,gr=0,drag=null;
  const pol=(a,r)=>[(vx+r*Math.cos(a*Math.PI/180)).toFixed(1),(vy+r*Math.sin(a*Math.PI/180)).toFixed(1)];
  svg.innerHTML=`<g id="dsc"></g><g id="dg"><polygon points="0,0 150,0 0,-150" fill="rgba(255,193,7,.55)" stroke="#b8860b" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="24,0 24,-24 0,-24" fill="none" stroke="#e63946" stroke-width="3"/><circle r="5" fill="#e63946"/>
    <circle cx="128" cy="0" r="14" fill="#ff7eb6" stroke="#23305a" stroke-width="3"/><circle id="dgh" cx="128" cy="0" r="22" fill="transparent"/></g>`;
  const sc=document.getElementById('dsc'),dg=document.getElementById('dg');
  const put=()=>dg.setAttribute('transform',`translate(${gx},${gy}) rotate(${gr})`);
  const norm=a=>((a%360)+360)%360,diff=(a,b)=>{const d=Math.abs(norm(a)-norm(b));return Math.min(d,360-d)};
  function check(){
    if(Math.hypot(gx-vx,gy-vy)>28){verdict.textContent='הצמידי את הפינה הישרה של הגוניה לקודקוד של הזווית.';return}
    const aligned=[gr,gr-90].some(l=>[rot,rot+deg].some(r=>diff(l,r)<8));
    if(!aligned){verdict.textContent='סובבי עד שצלע של הגוניה מונחת על צלע של הזווית.';return}
    verdict.textContent=Math.abs(deg-90)<2?'הזווית ישרה: היא נכנסת בדיוק בפינה של הגוניה.':deg<90?'הזווית צרה מהפינה של הגוניה, לכן היא חדה.':'הזווית רחבה מהפינה של הגוניה, לכן היא קהה.';
  }
  function scene(){
    const p1=pol(rot,R),p2=pol(rot+deg,R),a1=pol(rot,40),a2=pol(rot+deg,40);
    sc.innerHTML=`<line x1="${vx}" y1="${vy}" x2="${p1[0]}" y2="${p1[1]}" stroke="#23305a" stroke-width="6" stroke-linecap="round"/>
      <line x1="${vx}" y1="${vy}" x2="${p2[0]}" y2="${p2[1]}" stroke="#23305a" stroke-width="6" stroke-linecap="round"/>
      <path d="M${a1[0]} ${a1[1]} A40 40 0 0 1 ${a2[0]} ${a2[1]}" fill="none" stroke="#ff7eb6" stroke-width="5"/><circle cx="${vx}" cy="${vy}" r="6" fill="#23305a"/>`;
    check();
  }
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  svg.addEventListener('pointerdown',e=>{
    if(!e.target.closest('#dg'))return;const q=pt(e);
    drag=e.target.id==='dgh'?{rot:true}:{dx:q.x-gx,dy:q.y-gy};svg.setPointerCapture(e.pointerId);e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag)return;const q=pt(e);
    if(drag.rot)gr=Math.round(Math.atan2(q.y-gy,q.x-gx)*180/Math.PI);
    else{gx=Math.max(0,Math.min(600,q.x-drag.dx));gy=Math.max(0,Math.min(330,q.y-drag.dy))}
    put();check();
  });
  const up=()=>{drag=null};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  modal.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{deg=+b.dataset.d;scene()});
  put();scene();
}
const EXPLAIN={
 g1:{t:'צורות: צלעות וקודקודים',h:`<ul><li><b>צלע</b> היא קו ישר שמקיף את הצורה.</li><li><b>קודקוד</b> הוא הפינה שבה שתי צלעות נפגשות.</li><li>משולש: 3 צלעות. מרובע (ריבוע ומלבן): 4. מחומש: 5. משושה: 6. מתומן: 8.</li><li>לעיגול אין צלעות ואין קודקודים 🔵</li></ul>`,
  lv:['מזהים עיגול, משולש, ריבוע ומלבן לפי השם','כל הצורות, וגם שאלות על מספר הצלעות','הרבה שאלות על מספר צלעות: מחומש, משושה ומתומן']},
 g2:{t:'מודדים עם סרגל',h:`<ul><li>מצמידים את הסימן <b>0</b> של הסרגל לקצה של מה שמודדים.</li><li>קוראים את המספר שבו נגמר העיפרון.</li><li>בין שני מספרים יש קווים קטנים. כל קו הוא <b>מילימטר</b>: 10 מ"מ הם סנטימטר אחד, והקו הבינוני הוא חצי סנטימטר.</li></ul>`,
  lv:['מודדים אורכים שלמים עד 8 ס"מ','מודדים אורכים שלמים עד 11 ס"מ','מודדים גם חצאי סנטימטר, כמו 7.5 ס"מ']},
 g3:{t:'בונים צורות וזוויות ישרות',h:`<ul><li><b>זווית ישרה</b> היא פינה כמו של דף נייר. מסמנים אותה בריבוע קטן.</li><li><b>ריבוע</b>: 4 צלעות שוות ו-4 זוויות ישרות.</li><li><b>מלבן</b>: 4 זוויות ישרות, והצלעות שממול זו לזו שוות באורכן.</li><li><b>משולש ישר זווית</b>: באחת הפינות יש זווית ישרה.</li></ul>`,
  lv:['בונים משולש, ריבוע, מלבן ומשולש ישר זווית','עוד מחומש וריבוע עם אורך צלע נתון','גם מלבן עם אורך ורוחב נתונים']},
 g4:{t:'סימטריה: מראה קסומה',h:`<ul><li>צורה <b>סימטרית</b>: אם מקפלים אותה בקו המראה, שני החצאים נופלים בדיוק אחד על השני.</li><li>כל נקודה והבבואה שלה נמצאות באותו מרחק מהמראה.</li><li>טיפ: ספרי כמה משבצות המשבצת רחוקה מהקו, ובצד השני צבעי במרחק זהה.</li></ul>`,
  lv:['ציורים קטנים, בעיקר מראה אנכית','ציורים גדולים יותר, ומראה אופקית','ציורים גדולים מאוד: צריך ריכוז']},

// ---------- game 1: shape detective ----------
function detective(){
  const TOTAL=8;let n=0,got=0;
  function round(){
    if(n>=TOTAL){
      endScreen('🏆',`כל הכבוד! ${got} מתוך ${TOTAL} בניסיון הראשון!`,'g1',got,TOTAL,'את בלשית צורות מעולה!');return;
    }
    const LV=lvl('g1'),PL=LV===1?SHAPES.filter(s=>['circle','triangle','square','rect'].includes(s.id)):SHAPES,bySides=Math.random()<(LV===1?0:LV===2?.4:.6);
    let target,pool;
    if(bySides){
      target=shuffle(SHAPES.filter(s=>s.sides>0))[0];
      pool=SHAPES.filter(s=>s.sides!==target.sides);
    }else{
      target=shuffle(PL)[0];
      pool=PL.filter(s=>s.id!==target.id);
    }
    const opts=shuffle([target,...shuffle(pool).slice(0,4)]);
    const cols=shuffle(COLORS);
    const text=bySides?`מצאי את הצורה שיש לה ${target.sides} צלעות`:`מצאי את ה${target.he}`;
    main.innerHTML=`<div class="dots">${Array.from({length:TOTAL},(_,i)=>`<div class="dot ${i<n?'done':''}"></div>`).join('')}</div>
      <div class="q">${text}</div>
      <div class="cards">${opts.map((s,i)=>`<button class="card" data-i="${i}">${shapeSvg(s,cols[i])}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`;
    let first=true,locked=false;
    main.querySelectorAll('.card').forEach(btn=>btn.onclick=()=>{
      if(locked)return;
      const s=opts[+btn.dataset.i],fb=document.getElementById('fb');
      if(s===target){
        locked=true;btn.classList.add('ok');
        if(first){got++;addStar()}
        sndYay();bounce();
        fb.textContent=(s.sides?`${s.he}: ${s.sides} צלעות`:`${s.he}: אין לו צלעות, הוא עגול`)+' ⭐';
        say(who==='elephant'?'יששש!':'בננה!');
                n++;setTimeout(round,2200);
      }else{
        first=false;btn.classList.add('no');sndOops();
        fb.textContent='כמעט! נסי שוב 💪';say('נסי עוד פעם!');
        setTimeout(()=>btn.classList.remove('no'),450);
      }
    });
  }
  round();
}

// ---------- game 2: measure with a school ruler ----------
function rulerGame(){
  const TOTAL=6,U=50,RL=16; // 50 units = 1 cm, ruler is 16 cm
  let n=0,got=0;
  function rulerSvg(){
    let t='';
    for(let m=0;m<=RL*10;m++){
      const x=20+m*U/10,len=m%10===0?34:m%5===0?24:13;
      t+=`<line x1="${x}" y1="0" x2="${x}" y2="${len}" stroke="#23305a" stroke-width="${m%10===0?2.5:1.2}"/>`;
      if(m%10===0)t+=`<text x="${x}" y="58" font-size="20" font-weight="700" text-anchor="middle" fill="#23305a">${m/10}</text>`;
    }
    return `<g id="ruler" transform="translate(30,230)" style="cursor:grab">
      <rect x="0" y="0" width="${RL*U+40}" height="76" rx="6" fill="rgba(120,200,255,.6)" stroke="#23305a" stroke-width="2.5"/>
      ${t}<text x="${RL*U+10}" y="72" font-size="14" text-anchor="end" fill="#23305a">cm</text></g>`;
  }
  function round(){
    if(n>=TOTAL){
      endScreen('📏',`מדהים! ${got} מתוך ${TOTAL} מדידות נכונות בניסיון הראשון!`,'g2',got,TOTAL,'את מודדת מעולה!');return;
    }
    const LV=lvl('g2'),L=LV===1?rint(3,8):LV===2?rint(3,11):rint(3,11)+.5,x0=90+Math.floor(Math.random()*160),y0=90;
    const w=L*U,body=w-30,col=shuffle(COLORS)[0];
    const obj=`<rect x="${x0}" y="${y0}" width="22" height="40" fill="#ff9ec6" stroke="#23305a" stroke-width="2.5"/>
      <rect x="${x0+22}" y="${y0}" width="${body-22}" height="40" fill="${col}" stroke="#23305a" stroke-width="2.5"/>
      <polygon points="${x0+body},${y0} ${x0+w},${y0+20} ${x0+body},${y0+40}" fill="#ffe2b0" stroke="#23305a" stroke-width="2.5"/>
      <polygon points="${x0+w-9},${y0+14} ${x0+w},${y0+20} ${x0+w-9},${y0+26}" fill="#333"/>`;
    const ans=new Set([L]);
    while(ans.size<4){const c=L+rint(-3,3)*(LV===3?.5:1);if(c>0)ans.add(c)}
    const opts=shuffle([...ans]);
    main.innerHTML=`<div class="dots">${Array.from({length:TOTAL},(_,i)=>`<div class="dot ${i<n?'done':''}"></div>`).join('')}</div>
      <div class="q">גררי את הסרגל ומדדי: כמה ס"מ אורך העיפרון?</div>
      <svg id="sc" viewBox="0 0 1000 340" style="width:100%;background:#fff;border-radius:22px;box-shadow:0 5px 0 #0002;touch-action:none">
        ${obj}${rulerSvg()}</svg>
      <div class="cards" style="grid-template-columns:repeat(4,1fr);max-width:560px;margin:14px auto 0">
        ${opts.map(o=>`<button class="big" data-v="${o}" style="background:var(--blue)">${o}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`;
    // dragging (works with finger and mouse)
    const svg=document.getElementById('sc'),r=document.getElementById('ruler');
    let rx=30,ry=230,drag=null;
    const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
    r.addEventListener('pointerdown',e=>{const p=pt(e);drag={dx:p.x-rx,dy:p.y-ry};r.setPointerCapture(e.pointerId);e.preventDefault()});
    r.addEventListener('pointermove',e=>{
      if(!drag)return;const p=pt(e);
      rx=Math.max(-100,Math.min(1000-RL*U-40+100,p.x-drag.dx));ry=Math.max(0,Math.min(264,p.y-drag.dy));
      r.setAttribute('transform',`translate(${rx},${ry})`);
    });
    const up=()=>{drag=null};r.addEventListener('pointerup',up);r.addEventListener('pointercancel',up);
    let first=true,locked=false;
    main.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      if(locked)return;const fb=document.getElementById('fb');
      if(+b.dataset.v===L){
        locked=true;if(first){got++;addStar()}sndYay();bounce();
        fb.textContent=`נכון! ${L} ס"מ ⭐`;say(who==='elephant'?'יששש!':'בננה!');
                n++;setTimeout(round,2000);
      }else{
        first=false;sndOops();fb.textContent='נסי שוב! הצמידי את ה-0 לתחילת העיפרון 💪';say('נסי עוד פעם!');
      }
    });
  }
  say('סרגל כמו בבית הספר!');round();
}

// ---------- game 3: build a shape on a peg board ----------
function buildGame(){
  const TASKS=[
    {t:'בני משולש',n:3,k:'tri',fact:'למשולש יש 3 צלעות ו-3 פינות'},
    {t:'בני משולש עם זווית ישרה',n:3,k:'rtri',fact:'זווית ישרה היא פינה כמו של דף נייר'},
    {t:'בני ריבוע',n:4,k:'sq',fact:'בריבוע כל 4 הצלעות שוות וכל 4 הזוויות ישרות'},
    {t:'בני מלבן (שאינו ריבוע)',n:4,k:'rect',fact:'במלבן 4 זוויות ישרות, והצלעות שממול שוות'},
    {t:'בני מחומש',n:5,k:'pent',fact:'למחומש יש 5 צלעות'},
    {t:'בני מלבן: אורך 4 יחידות ורוחב 2 יחידות',n:4,k:'rect',dims:[4,2],fact:'מלבן 4 על 2'},
    {t:'בני ריבוע שאורך כל צלע שלו 3 יחידות',n:4,k:'sq',side:3,fact:'ריבוע עם צלע 3'}
  ];
  const S=60,OX=30,OY=30,GX=9,GY=7; // grid: 10 x 8 points
  const LV=lvl('g3'),tasks=shuffle(LV===1?[0,1,2,3]:LV===2?[0,1,2,3,4,6]:[0,1,2,3,4,5,6]).map(i=>TASKS[i]),TOTAL=tasks.length;
  let n=0,got=0;
  function sortPts(ps){
    const cx=ps.reduce((a,p)=>a+p.x,0)/ps.length,cy=ps.reduce((a,p)=>a+p.y,0)/ps.length;
    return ps.slice().sort((p,q)=>Math.atan2(p.y-cy,p.x-cx)-Math.atan2(q.y-cy,q.x-cx));
  }
  function analyze(ps){
    const m=ps.length,cr=[],dt=[],len=[];
    for(let i=0;i<m;i++){
      const a=ps[i],b=ps[(i+1)%m],c=ps[(i+2)%m];
      const ux=b.x-a.x,uy=b.y-a.y,vx=c.x-b.x,vy=c.y-b.y;
      cr.push(ux*vy-uy*vx);dt.push(ux*vx+uy*vy);len.push(ux*ux+uy*uy);
    }
    return{cr,dt,len,convex:cr.every(x=>x>0)||cr.every(x=>x<0)};
  }
  function ok(task,ps){
    const A=analyze(sortPts(ps)),right=A.dt.every(d=>d===0);
    if(!A.convex)return false;
    switch(task.k){
      case'tri':return true;
      case'rtri':return A.dt.some(d=>d===0);
      case'pent':return true;
      case'sq':return right&&A.len.every(l=>l===A.len[0])&&(!task.side||A.len[0]===task.side*task.side);
      case'rect':{
        if(!right)return false;
        if(task.dims){const want=[task.dims[0]**2,task.dims[0]**2,task.dims[1]**2,task.dims[1]**2].sort((a,b)=>a-b);
          return A.len.slice().sort((a,b)=>a-b).every((l,i)=>l===want[i])}
        return A.len[0]!==A.len[1];
      }
    }
  }
  function round(){
    if(n>=TOTAL){

    }

    const pegs=Array.from({length:task.n},(_,i)=>({x:1+i*2,y:0})); // start in a straight row (top, away from the character)
    const px=p=>OX+p.x*S,py=p=>OY+p.y*S;
    let dots='';
    for(let i=0;i<=GX;i++)for(let j=0;j<=GY;j++)dots+=`<circle cx="${OX+i*S}" cy="${OY+j*S}" r="4" fill="#9aa7c7"/>`;

      <div class="fb" id="fb"></div>`;
    const svg=document.getElementById('bd'),dyn=document.getElementById('dyn'),els=[...svg.querySelectorAll('.peg')];
    function draw(){
      els.forEach((g,i)=>g.setAttribute('transform',`translate(${px(pegs[i])},${py(pegs[i])})`));

      for(let i=0;i<m;i++){
        const a=o[i],b=o[(i+1)%m],c=o[(i+2)%m];
        if(A.dt[i]===0&&A.cr[i]!==0){ // right-angle mark at vertex b
          const u=[a.x-b.x,a.y-b.y],v=[c.x-b.x,c.y-b.y],lu=Math.hypot(...u),lv=Math.hypot(...v),k=16;
          const p0=[px(b)+u[0]/lu*k,py(b)+u[1]/lu*k],p2=[px(b)+v[0]/lv*k,py(b)+v[1]/lv*k],p1=[p0[0]+p2[0]-px(b),p0[1]+p2[1]-py(b)];
          h+=`<polyline points="${p0} ${p1} ${p2}" fill="none" stroke="#e63946" stroke-width="3"/>`;
        }
        if(a.x===b.x||a.y===b.y){ // length label on straight sides
          const L=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
          h+=`<text x="${(px(a)+px(b))/2}" y="${(py(a)+py(b))/2-8}" font-size="20" font-weight="700" text-anchor="middle" fill="#e63946">${L}</text>`;
        }

// ---------- game 4: magic mirror (symmetry) ----------
function mirrorGame(){
  const TOTAL=6,C=56;
  const plan=[[['v',3],['v',4],['v',4],['v',5],['h',3],['h',4]],[['v',4],['v',5],['v',6],['v',8],['h',5],['h',7]],[['v',7],['v',9],['h',7],['h',9],['v',10],['h',10]]][lvl('g4')-1]; // first vertical mirror, then horizontal
  let n=0,got=0;
  function round(){
    if(n>=TOTAL){
      endScreen('🪞',`הקסם עבד! ${got} מתוך ${TOTAL} ציורים נכונים בניסיון הראשון!`,'g4',got,TOTAL,'את קוסמת של סימטריה!');return;
    }
    const [mode,k]=plan[n],V=mode==='v';
    const cols=V?8:5,rows=V?5:8,W=cols*C,H=rows*C;
    const mir=(c,r)=>V?[7-c,r]:[c,7-r];
    const srcAll=[];
    for(let c=0;c<cols;c++)for(let r=0;r<rows;r++)if(V?c<4:r<4)srcAll.push([c,r]);
    const src=shuffle(srcAll).slice(0,k);
    const srcSet=new Set(src.map(p=>p.join()));
    const target=new Set(src.map(([c,r])=>mir(c,r).join()));
    const color=shuffle(COLORS)[0],EMPTY='#f4f7ff';
    const mine=new Set();
    let g='';
    for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
      const key=c+','+r,isSrc=V?c<4:r<4;
      g+=`<rect ${isSrc?'':`class="tc" data-k="${key}" style="cursor:pointer"`} x="${c*C+2}" y="${r*C+2}" width="${C-4}" height="${C-4}" rx="8"
        fill="${srcSet.has(key)?color:EMPTY}" stroke="${isSrc?'#9aa7c7':'#23305a'}" stroke-width="2" ${isSrc?'':'stroke-dasharray="6 4"'}/>`;
    }
    const line=V?`<line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" stroke="#e63946" stroke-width="6"/><text x="${W/2}" y="-6" font-size="26" text-anchor="middle">🪞</text>`
                :`<line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#e63946" stroke-width="6"/><text x="${W+2}" y="${H/2+9}" font-size="26">🪞</text>`;
    main.innerHTML=`<div class="dots">${Array.from({length:TOTAL},(_,i)=>`<div class="dot ${i<n?'done':''}"></div>`).join('')}</div>
      <div class="q">${V?'המראה הקסומה במרכז: צבעי בצד השני את הבבואה':'המראה הקסומה באמצע: צבעי למטה את הבבואה'}</div>
      <svg id="mr" viewBox="-6 -34 ${W+46} ${H+40}" style="width:100%;max-width:${V?720:380}px;max-height:58vh;display:block;margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 5px 0 #0002;padding:6px">${g}${line}</svg>
      <div class="center" style="margin-top:12px"><button class="big" id="chk" style="background:var(--green)">בדקי ✅</button></div>
      <div class="fb" id="fb"></div>`;
    const svg=document.getElementById('mr');
    let first=true,locked=false;
    svg.addEventListener('click',e=>{
      const key=e.target.dataset&&e.target.dataset.k;if(!key||locked)return;
      if(mine.has(key)){mine.delete(key);e.target.setAttribute('fill',EMPTY)}else{mine.add(key);e.target.setAttribute('fill',color)}
      
    });
    const plural=(x,one,many)=>x===1?one:`${x} ${many}`;
    document.getElementById('chk').onclick=()=>{
      if(locked)return;const fb=document.getElementById('fb');
      const missing=[...target].filter(x=>!mine.has(x)).length,extra=[...mine].filter(x=>!target.has(x)).length;
      if(!missing&&!extra){
        locked=true;if(first){got++;addStar()}sndYay();bounce();
        fb.textContent='מושלם! הבבואה נמצאת באותו מרחק מהמראה ⭐';say(who==='elephant'?'יששש!':'בננה!');
                n++;setTimeout(round,2600);
      }else{
        first=false;sndOops();
        const parts=[];
        if(missing)parts.push(missing===1?'חסרה משבצת אחת':`חסרות ${missing} משבצות`);
        if(extra)parts.push(extra===1?'יש משבצת אחת מיותרת':`יש ${extra} משבצות מיותרות`);
        fb.textContent='כמעט! '+parts.join(' ו')+' 💪';say('נסי עוד פעם!');
      }
    };
  }
  say('מה שיש בצד אחד, יופיע גם בצד השני!');round();
}

const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function numOpts(c){ // 4 different positive numbers around the right answer
  const s=new Set([c]);let guard=0;
  while(s.size<4&&guard++<200){const v=c+rint(-4,4);if(v>0)s.add(v)}
  return shuffle([...s]);
}

  const lsh=(A,D,B,C)=>({pts:[[0,0],[A,0],[A,B],[C,B],[C,D],[0,D]],grid:true,ans:2*(A+D)});
  const lrect=(w,h)=>({pts:[[40,60],[360,60],[360,200],[40,200]],labels:[w,h,w,h],ans:2*(w+h)});
  const tri=(lo,hi)=>{const v=shuffle(Array.from({length:hi-lo+1},(_,k)=>lo+k)).slice(0,3);return{pts:[[40,240],[360,240],[200,40]],labels:v,ans:v[0]+v[1]+v[2]}};
  const sqr=s=>({pts:[[110,40],[290,40],[290,220],[110,220]],labels:[s,null,null,null],ans:4*s,note:'בריבוע כל הצלעות שוות'});
  const hexa=s=>({pts:[0,1,2,3,4,5].map(k=>{const a=k*Math.PI/3;return[Math.round(200+100*Math.cos(a)),Math.round(130+100*Math.sin(a))]}),labels:[s,null,null,null,null,null],ans:6*s,note:'במשושה משוכלל כל 6 הצלעות שוות'});
  const miss=()=>{const P=2*rint(10,16),w=rint(3,P/2-3);return{pts:[[40,60],[360,60],[360,200],[40,200]],labels:[w,'?',w,'?'],ans:P/2-w,q:`היקף המלבן הוא ${P} ס"מ. מה אורך הצלע שסימנו ב-? (בס"מ)`}};
  const plans=[
    [()=>rect(rint(2,4),rint(2,3)),()=>rect(rint(2,4),rint(2,3)),()=>lsh(rint(3,4),rint(3,4),1,1),()=>lrect(rint(3,6),rint(2,5)),()=>tri(2,5),()=>sqr(rint(2,5))],

function angleInfo(p){
  const m=p.length,res=[];
  for(let i=0;i<m;i++){
    const a=p[(i+m-1)%m],b=p[i],c=p[(i+1)%m];
    const ux=a[0]-b[0],uy=a[1]-b[1],vx=c[0]-b[0],vy=c[1]-b[1];
    const deg=Math.acos((ux*vx+uy*vy)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)))*180/Math.PI;
    res.push({deg,type:Math.abs(deg-90)<.6?'right':deg<90?'acute':'obtuse',u:[ux,uy],v:[vx,vy],b});
  }
  return res;
}
const polyProps=s=>{const A=angleInfo(s.p);return{sides:s.p.length,right:A.filter(a=>a.type==='right').length,acute:A.filter(a=>a.type==='acute').length,obtuse:A.filter(a=>a.type==='obtuse').length,sym:s.sym,eq:s.eq}};
function polySvg(s,col,marks,label){
  let g=`<polygon points="${s.p.map(q=>q.join(',')).join(' ')}" fill="${col}" stroke="#23305a" stroke-width="4" stroke-linejoin="round"/>`;
  if(marks)angleInfo(s.p).forEach(a=>{
    const lu=Math.hypot(...a.u),lv=Math.hypot(...a.v),r=20,u=[a.u[0]/lu,a.u[1]/lu],v=[a.v[0]/lv,a.v[1]/lv];
    const p1=[a.b[0]+u[0]*r,a.b[1]+u[1]*r],p2=[a.b[0]+v[0]*r,a.b[1]+v[1]*r];
    if(a.type==='right'){const p3=[p1[0]+p2[0]-a.b[0],p1[1]+p2[1]-a.b[1]];g+=`<polyline points="${p1} ${p3} ${p2}" fill="none" stroke="#e63946" stroke-width="4"/>`}
    else{const sw=(u[0]*v[1]-u[1]*v[0])>0?1:0;g+=`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A${r} ${r} 0 0 ${sw} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" fill="none" stroke="${a.type==='acute'?'#1b9e5a':'#2f6fed'}" stroke-width="4"/>`}
  });
  if(label)g+=`<text x="100" y="196" font-size="20" font-weight="800" text-anchor="middle" fill="#23305a">${label}</text>`;
  return g;
}

      angs=[{deg:a,l1:la,l2:la,col:COLS[0],label:LET[0]},{deg:b,l1:lb,l2:lb,col:COLS[1],label:LET[1]}];q='איזו זווית גדולה יותר?';mode='pick';

// ---------- game 12: the clock ----------
function clockGame(){
  const TOTAL=6,LV=lvl('g12');let n=0,got=0;
  const MINS=LV===1?[0,30]:LV===2?[0,15,30,45]:[0,5,10,15,20,25,30,35,40,45,50,55];

  const HL=['לשתים עשרה','לאחת','לשתיים','לשלוש','לארבע','לחמש','לשש','לשבע','לשמונה','לתשע','לעשר','לאחת עשרה'];
  const fmt=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
  const phrase=(h,m)=>m===0?`${HN[h%12]} בדיוק`:m===15?`${HN[h%12]} ורבע`:m===30?`${HN[h%12]} וחצי`:m===45?`רבע ${HL[(h+1)%12]}`:'';
  const hand=(a,len,w,col,id)=>`<line ${id?`id="${id}" `:''}x1="150" y1="150" x2="${(150+len*Math.sin(a*Math.PI/180)).toFixed(1)}" y2="${(150-len*Math.cos(a*Math.PI/180)).toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  function face(){
    let t='<circle cx="150" cy="150" r="136" fill="#fff" stroke="#23305a" stroke-width="6"/>';
    for(let k=0;k<60;k++){const a=k*6*Math.PI/180,r1=k%5?122:114;t+=`<line x1="${(150+r1*Math.sin(a)).toFixed(1)}" y1="${(150-r1*Math.cos(a)).toFixed(1)}" x2="${(150+130*Math.sin(a)).toFixed(1)}" y2="${(150-130*Math.cos(a)).toFixed(1)}" stroke="#23305a" stroke-width="${k%5?1.5:3.5}"/>`}
    for(let k=1;k<=12;k++){const a=k*30*Math.PI/180;t+=`<text x="${(150+96*Math.sin(a)).toFixed(1)}" y="${(150-96*Math.cos(a)+9).toFixed(1)}" font-size="26" font-weight="800" text-anchor="middle" fill="#23305a">${k}</text>`}
    return t;
  }
  function round(){
    if(n>=TOTAL){endScreen('🕒',`שעון: ${got} מתוך ${TOTAL} בניסיון הראשון!`,'g12',got,TOTAL,'את קוראת שעון מעולה!');return}
    const mode=n%2===0?'read':'set',m=shuffle(MINS)[0],h=mode==='set'?rint(1,11):rint(1,12);
    const ha=(h%12)*30+m*.5,ma=m*6,ph=phrase(h,m);
    const svgOpen=`<svg id="ck" viewBox="0 0 300 300" style="width:100%;max-width:min(360px,46vh);display:block;margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 5px 0 #0002;touch-action:none">`;
    if(mode==='read'){
      const bad=[fmt(h,m/5),fmt(h===12?1:h+1,m),fmt(h===1?12:h-1,m),fmt(m/5||12,(h*5)%60),fmt(h,(m+30)%60)].filter((x,i,a)=>x!==fmt(h,m)&&a.indexOf(x)===i);
      const opts=shuffle([fmt(h,m),...shuffle(bad).slice(0,3)]);
      main.innerHTML=`${dotsHtml(n,TOTAL)}<div class="q">מה השעה?</div>${svgOpen}${face()}${hand(ha,62,9,'#23305a')}${hand(ma,105,5,'#e63946')}<circle cx="150" cy="150" r="9" fill="#23305a"/></svg>
        <div class="center" style="margin-top:12px">${opts.map(o=>`<button class="big" data-v="${o}" style="background:var(--blue);margin:4px;min-width:96px;direction:ltr">${o}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
      let first=true,locked=false;
      main.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
        if(locked)return;const fb=document.getElementById('fb');
        if(b.dataset.v===fmt(h,m)){locked=true;if(first){got++;addStar()}sndYay();bounce();fb.textContent=`${fmt(h,m)}${ph?' ('+ph+')':''}. המחוג הארוך על ${m/5}: ${m} דקות ⭐`;say(who==='elephant'?'יששש!':'בננה!');n++;setTimeout(round,3600)}
        else{first=false;sndOops();fb.textContent='נסי שוב! המחוג הקצר מראה שעות, והארוך מראה דקות. כל מספר הוא קפיצה של 5 דקות 💪';say('נסי עוד פעם!')}
      });
    }else{
      main.innerHTML=`${dotsHtml(n,TOTAL)}<div class="q">הראי את השעה <span style="direction:ltr;display:inline-block">${fmt(h,m)}</span>${ph?` (${ph})`:''}</div>
        <div class="center" style="margin:-4px 0 6px">גררי את המחוג הארוך (אדום) ואת המחוג הקצר (כהה)</div>
        ${svgOpen}${face()}${hand(0,62,9,'#23305a','hh')}${hand(0,105,5,'#e63946','mh')}<circle cx="150" cy="150" r="9" fill="#23305a"/><circle id="hhk" cx="150" cy="88" r="13" fill="#23305a" opacity=".25"/><circle id="mhk" cx="150" cy="45" r="13" fill="#e63946" opacity=".3"/></svg>
        <div class="center" style="margin-top:12px"><button class="big" id="chk" style="background:var(--green)">בדקי ✅</button></div><div class="fb" id="fb"></div>`;
      const svg=document.getElementById('ck'),HH=document.getElementById('hh'),MH=document.getElementById('mh'),KH=document.getElementById('hhk'),KM=document.getElementById('mhk');
      let cha=0,cma=0,drag=null;
      const tip=(a,len)=>[150+len*Math.sin(a*Math.PI/180),150-len*Math.cos(a*Math.PI/180)];
      const put=()=>{
        const th=tip(cha,62),tm=tip(cma,105);
        HH.setAttribute('x2',th[0]);HH.setAttribute('y2',th[1]);MH.setAttribute('x2',tm[0]);MH.setAttribute('y2',tm[1]);
        KH.setAttribute('cx',th[0]);KH.setAttribute('cy',th[1]);KM.setAttribute('cx',tm[0]);KM.setAttribute('cy',tm[1]);
      };put();
      const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
      svg.addEventListener('pointerdown',e=>{
        const q=pt(e),th=tip(cha,62),tm=tip(cma,105),dh=Math.hypot(q.x-th[0],q.y-th[1]),dm=Math.hypot(q.x-tm[0],q.y-tm[1]);
        if(Math.min(dh,dm)>48)return;drag=dm<=dh?'m':'h';svg.setPointerCapture(e.pointerId);e.preventDefault();
      });
      svg.addEventListener('pointermove',e=>{
        if(!drag)return;const q=pt(e);let a=Math.atan2(q.x-150,-(q.y-150))*180/Math.PI;a=(a+360)%360;
        if(drag==='m')cma=(Math.round(a/30)*30)%360;else cha=(Math.round(a/5)*5)%360;put();
      });
      const up=()=>{drag=null};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
      let first=true,locked=false;
      document.getElementById('chk').onclick=()=>{
        if(locked)return;const fb=document.getElementById('fb');
        const dh=Math.abs(((cha-ha+540)%360)-180),okM=Math.round(cma/6)%60===m%60,okH=dh<=17;
        if(okM&&okH){locked=true;if(first){got++;addStar()}sndYay();bounce();fb.textContent=`נכון! ${fmt(h,m)}${ph?' ('+ph+')':''} ⭐`;say(who==='elephant'?'יששש!':'בננה!');n++;setTimeout(round,3000)}
        else{first=false;sndOops();fb.textContent=!okM?'המחוג הארוך (הדקות) לא במקום הנכון. כל מספר הוא קפיצה של 5 דקות 💪':'המחוג הקצר (השעות) לא במקום הנכון. הוא עומד ליד המספר של השעה 💪';say('נסי עוד פעם!')}
      };
    }
  }
  say('בואי נלמד שעון!');round();
}

// ---------- game 13: the shape mystery ----------
function mysteryGame(){
  const TOTAL=5,LV=lvl('g13');let n=0,got=0;
  const POOLN=LV===1?4:LV===2?6:8,COLS2=['#ff9ec6','#ffd27f','#9be3b3','#9cc9ff','#cdb4ff','#ff9a9a','#7fdccf','#ffe27f'];
  const cnt=(w,k,x)=>x===0?`אין בה זוויות ${w[1]}`:x===1?`יש בה זווית ${w[2]} אחת`:`יש בה ${x} זוויות ${w[1]}`;
  const CL=[
    s=>({k:'sides',v:s.sides,t:`יש לה ${s.sides} צלעות`}),
    s=>({k:'right',v:s.right,t:cnt(['','ישרות','ישרה'],'right',s.right)}),
    s=>({k:'acute',v:s.acute,t:cnt(['','חדות','חדה'],'acute',s.acute)}),
    s=>({k:'obtuse',v:s.obtuse,t:cnt(['','קהות','קהה'],'obtuse',s.obtuse)}),
    s=>({k:'sym',v:s.sym,t:s.sym?'יש לה ציר סימטריה':'אין לה ציר סימטריה'}),
    s=>({k:'eq',v:s.eq,t:s.eq?'כל הצלעות שלה שוות':'לא כל הצלעות שלה שוות'})
  ];
  function build(){
    for(let tries=0;tries<80;tries++){
      const pool=shuffle(POLYS).slice(0,POOLN),target=pool[0],P=polyProps(target);
      let rest=pool.slice(1).map(s=>({s,P:polyProps(s)})),clues=[];
      const cand=CL.map(f=>f(P));
      while(rest.length&&clues.length<4){
        const usable=cand.filter(c=>!clues.some(x=>x.k===c.k)&&rest.some(r=>r.P[c.k]!==c.v));
        if(!usable.length)break;
        const best=shuffle(usable)[0];clues.push(best);rest=rest.filter(r=>r.P[best.k]===best.v);
      }
      if(!rest.length&&clues.length>=(LV===1?2:3))return{pool:shuffle(pool),target,clues};
    }
    return null;
  }
  function round(){
    if(n>=TOTAL){endScreen('🕵️',`פתרת ${got} תעלומות מתוך ${TOTAL} בניסיון הראשון!`,'g13',got,TOTAL,'את בלשית מעולה!');return}
    const r=build();if(!r){n++;round();return}
    const {pool,target,clues}=r;let shown=LV===1?clues.length:Math.min(2,clues.length);
    main.innerHTML=`${dotsHtml(n,TOTAL)}<div class="q">איזו צורה מסתתרת? קראי את הרמזים</div><div id="cl" class="center" style="font-size:22px;font-weight:700"></div>
      <div class="center" id="nx" style="margin:8px 0"></div>
      <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${pool.map((s,i)=>`<button class="card" data-i="${i}"><svg viewBox="0 0 200 205">${polySvg(s,COLS2[i%COLS2.length],false,s.n)}</svg></button>`).join('')}</div>
      <div class="fb" id="fb"></div>`;
    const cl=document.getElementById('cl'),nx=document.getElementById('nx'),fb=document.getElementById('fb');
    function draw(){
      cl.innerHTML=clues.slice(0,shown).map((c,i)=>`<div style="background:#fff;border-radius:14px;padding:6px 14px;margin:5px auto;max-width:460px">${i+1}. ${c.t}</div>`).join('');
      nx.innerHTML=shown<clues.length?'<button class="big" id="nxb" style="background:var(--blue);font-size:18px;padding:10px 18px">רמז הבא</button>':'';
      const b=document.getElementById('nxb');if(b)b.onclick=()=>{shown++;draw()};
    }
    draw();
    let first=true,locked=false;
    main.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
      if(locked)return;const s=pool[+b.dataset.i];
      if(s===target){locked=true;if(first){got++;addStar()}sndYay();bounce();b.classList.add('ok');shown=clues.length;draw();fb.textContent=`נכון! זאת ${s.n}. כל הרמזים מתאימים ⭐`;say(who==='elephant'?'יששש!':'בננה!');n++;setTimeout(round,3600)}
      else{
        first=false;b.classList.add('no');sndOops();setTimeout(()=>b.classList.remove('no'),450);
        const P=polyProps(s),bad=clues.slice(0,shown).find(c=>P[c.k]!==c.v);
        fb.textContent=bad?`לא מתאימה לרמז: ${bad.t} 💪`:'עוד יותר מצורה אחת מתאימה לרמזים. לחצי על "רמז הבא" 💪';say('נסי עוד פעם!');
      }
    });
  }
  say('בואי נפתור תעלומה!');round();
